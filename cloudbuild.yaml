steps:
  # Build Backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/${PROJECT_ID}/todo-backend:${BUILD_ID}', './backend']
  
  # Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/${PROJECT_ID}/todo-frontend:${BUILD_ID}', './frontend']

  # Push Images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/todo-backend:${BUILD_ID}']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/todo-frontend:${BUILD_ID}']

  # Update manifests with build ID
  - name: 'ubuntu'
    args:
      - 'bash'
      - '-c'
      - |
        sed -i "s|TODO_BACKEND_IMAGE|gcr.io/${PROJECT_ID}/todo-backend:${BUILD_ID}|g" k8s/backend.yaml
        sed -i "s|TODO_FRONTEND_IMAGE|gcr.io/${PROJECT_ID}/todo-frontend:${BUILD_ID}|g" k8s/frontend.yaml

  # Deploy to GKE
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'apply'
      - '-f'
      - 'k8s/'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'

substitutions:
  _REGION: us-central1
  _CLUSTER: todo-cluster
